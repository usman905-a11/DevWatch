[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "devwatch"
version = "0.1.0"
description = "Multi-Agent Code Review System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "openai>=3,<4",
    "httpx>=0.27,<1",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "langsmith>=0.3.45,<1.0.0",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<3.2",
    "reportlab>=5,<6",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "psutil>=7.2,<8; sys_platform == 'win32'"
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
    "pymupdf>=1.28,<2",
]


[project.scripts]
devwatch = "devwatch.cli:app"

[tool.setuptools.packages.find]
include = ["devwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
